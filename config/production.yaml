environment: production
debug: false

# AI Model Configurations
ai_models:
  resume_analyzer:
    model_path: "models/trained_models/resume_analyzer/"
    confidence_threshold: 0.8
    max_input_length: 512
  job_matcher:
    model_path: "models/trained_models/job_matcher/"
    similarity_threshold: 0.85
    embedding_dim: 768
  interview_simulator:
    model_path: "models/trained_models/interview_simulator/"
    difficulty_levels: ["junior", "mid", "senior", "expert"]
  
  # Model Training
  training:
    batch_size: 64
    learning_rate: 0.0005
    epochs: 200
    early_stopping_patience: 15

# API Configurations
apis:
  linkedin:
    base_url: "https://api.linkedin.com/v2"
    rate_limit: 1000
    timeout: 60
  indeed:
    base_url: "https://api.indeed.com"
    rate_limit: 500
    timeout: 60
  glassdoor:
    base_url: "https://api.glassdoor.com"
    rate_limit: 1000
    timeout: 60
  
  # External AI Services
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4"
    max_tokens: 4000
  huggingface:
    api_key: "${HUGGINGFACE_API_KEY}"
    models:
      - "bert-base-uncased"
      - "sentence-transformers/all-MiniLM-L6-v2"

# Database Configuration
database:
  postgres:
    host: "${DB_HOST}"
    port: 5432
    name: "job_application_prod"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
    pool_size: 50
    max_overflow: 100
    ssl_mode: "require"
  
  redis:
    host: "${REDIS_HOST}"
    port: 6379
    db: 0
    password: "${REDIS_PASSWORD}"
    ssl: true

# Security Configuration
security:
  encryption_key: "${ENCRYPTION_KEY}"
  jwt_secret: "${JWT_SECRET}"
  ssl_required: true
  cors_origins:
    - "https://jobapplicationai.com"
    - "https://www.jobapplicationai.com"
  
  # Rate Limiting
  rate_limits:
    general: "10000/hour"
    job_search: "1000/hour"
    application_submission: "500/hour"
  
  # Data Privacy
  data_retention:
    user_data: "90 days"
    application_data: "2 years"
    analytics_data: "1 year"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/production.log"
  max_size: "1GB"
  backup_count: 10
  
  # Structured Logging
  structured: true
  include_traceback: false

# Performance Configuration
performance:
  cache_ttl: 7200  # 2 hours
  request_timeout: 60
  max_concurrent_requests: 1000
  database_timeout: 30
  
  # Memory Management
  max_memory_usage: "8GB"
  garbage_collection_threshold: 0.9

# Feature Flags
features:
  enable_advanced_ai: true
  enable_market_analysis: true
  enable_competitor_intelligence: true
  enable_interview_simulation: true
  enable_realtime_notifications: true
  
  # Experimental Features
  experimental:
    enable_deep_agents: true
    enable_strategic_intelligence: true
    enable_synthetic_data_generation: true

# Monitoring and Analytics
monitoring:
  enable_metrics: true
  enable_tracing: true
  enable_health_checks: true
  
  # External Monitoring
  datadog:
    api_key: "${DATADOG_API_KEY}"
    enabled: true
  sentry:
    dsn: "${SENTRY_DSN}"
    enabled: true

# External Services
external_services:
  email:
    provider: "sendgrid"
    api_key: "${SENDGRID_API_KEY}"
    from_email: "noreply@jobapplicationai.com"
  
  storage:
    provider: "aws_s3"
    bucket: "job-application-ai-prod"
    region: "us-east-1"
  
  queue:
    provider: "redis"
    default_queue: "default"
    retry_queues: true

# Scaling Configuration
scaling:
  horizontal:
    min_instances: 3
    max_instances: 10
    target_cpu_utilization: 0.7
  
  vertical:
    memory_limit: "8Gi"
    cpu_limit: "2000m"
  
  # Auto-scaling triggers
  scaling_triggers:
    - metric: "cpu_utilization"
      threshold: 70
      duration: "5m"
    - metric: "memory_utilization"
      threshold: 80
      duration: "5m"
    - metric: "request_latency"
      threshold: 500
      duration: "5m"
